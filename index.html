<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Validação de Vaga</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Cadastro de Vaga</h2>
        <input type="text" id="nome" placeholder="Seu nome">
        <input type="number" id="idade" placeholder="Sua idade">
        <input type="number" id="altura" step="0.01" placeholder="Sua altura (ex: 1.75)">
        
        <button onclick="verificarVaga()">Verificar Aptidão</button>
        
        <p id="resultado"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
